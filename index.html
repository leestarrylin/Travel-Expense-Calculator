<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#3b6ef6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行记账">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
<title>旅行记账 · 多人分摊</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div style="min-width:0">
      <div class="tb-title" id="tripName">旅行记账</div>
      <div class="tb-sub" id="tripSub"></div>
    </div>
    <div class="tb-right">
      <button class="icon-btn" id="btnGoSettings" aria-label="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ============ 明细 ============ -->
  <section class="view active" data-view="list">
    <div class="hero">
      <div class="hero-top">
        <span class="hero-label">本次总支出</span>
        <span class="hero-cur" id="heroCur">CNY</span>
      </div>
      <div class="hero-amount" id="heroTotal">¥0.00</div>
      <div class="hero-meta" id="heroMeta">人均 ¥0.00 · 0 笔</div>
      <div class="hero-settle" id="heroSettle"></div>
    </div>
    <div class="filter-row" id="filters"></div>
    <div id="listBody"></div>
  </section>

  <!-- ============ 统计 ============ -->
  <section class="view" data-view="stats">
    <div style="padding-top:6px">
      <div class="card">
        <h3 class="card-h">📊 分类构成 <span class="sub" id="statSub"></span></h3>
        <div id="catBars"></div>
      </div>
      <div class="card">
        <h3 class="card-h">📅 每日花费</h3>
        <div class="daychart" id="dayChart"></div>
      </div>
      <div class="card">
        <h3 class="card-h">👥 已付 / 应担对比</h3>
        <div id="cmpBox"></div>
      </div>
      <div class="card">
        <h3 class="card-h">💳 支付方式</h3>
        <div id="payStats"></div>
      </div>
      <div class="card">
        <h3 class="card-h">💱 各币种支出</h3>
        <div class="cur-list" id="curPills"></div>
        <div class="note">折合金额按「设置」里的汇率换算。</div>
      </div>
    </div>
  </section>

  <!-- ============ 结算 ============ -->
  <section class="view" data-view="settle">
    <div style="padding-top:6px">
      <div class="card settle-big" id="settleBig"></div>
      <div class="mcards" id="memberCards"></div>
      <div class="card" style="padding:4px 16px 8px">
        <h3 class="card-h" style="margin:12px 0 2px">💸 转账方案</h3>
        <div id="transferList"></div>
      </div>
      <button class="btn primary" id="btnCopy">📋 复制结算结果，发到群里</button>
      <div class="note" style="text-align:center">
        结余 = 已付 − 应担。正数该收钱，负数该付钱。<br>
        按最少笔数给出转账方案，全部转完即两清。
      </div>
    </div>
  </section>

  <!-- ============ 设置 ============ -->
  <section class="view" data-view="settings">
    <div style="padding-top:6px">
      <div class="set-group no-clip">
        <div class="gh">行程信息</div>
        <div class="set-row"><label>名称</label><input type="text" id="sName" maxlength="30" placeholder="例如：关西赏枫 5 日"></div>
        <div class="set-row"><label>目的地</label>
          <div class="dest-wrap">
            <input type="text" id="sDest" maxlength="40" placeholder="输入国家或城市，自动匹配币种" autocomplete="off">
            <div class="dest-pop" id="destPop"></div>
          </div>
        </div>
        <div class="set-row"><label>出发</label><input type="date" id="sStart"></div>
        <div class="set-row"><label>返程</label><input type="date" id="sEnd"></div>
        <div class="set-row"><label>结算货币</label><select id="sBase"></select></div>
      </div>

      <div class="set-group">
        <div class="gh">同行成员<span class="mcount" id="memberCount">2 人</span></div>
        <div id="memberRows"></div>
        <button class="add-cur" id="btnAddMember">＋ 添加成员</button>
      </div>

      <div class="set-group">
        <div class="gh">币种与汇率<span class="mcount" id="defCurTip">默认</span></div>
        <div id="curRows"></div>
        <button class="add-cur" id="btnAddCur">＋ 添加币种</button>
      </div>

      <div class="set-group">
        <div class="gh">支付方式</div>
        <div id="payRows"></div>
        <button class="add-cur" id="btnAddPay">＋ 添加支付方式</button>
      </div>

      <div class="set-group">
        <div class="gh">数据</div>
        <div class="data-btns">
          <button class="btn sm primary" id="btnXlsx">导出 Excel</button>
          <button class="btn sm" id="btnCsv">导出 CSV</button>
          <button class="btn sm" id="btnBackup">备份 JSON</button>
          <button class="btn sm" id="btnRestore">导入 JSON</button>
        </div>
        <div class="set-row" style="border-top:1px solid #f2f5fa">
          <div style="font-size:12px;color:#8b97a8;line-height:1.6" id="storageTip"></div>
        </div>
        <div class="data-btns" style="padding-top:0">
          <button class="btn sm danger" id="btnClear">清空全部明细</button>
        </div>
      </div>

      <div class="set-foot">
        <button class="btn primary" id="btnSaveSettings">保存设置</button>
      </div>

      <div class="note" style="text-align:center;padding-bottom:10px">
        数据保存在本机浏览器（IndexedDB），不上传服务器。<br>
        换手机或清理浏览器数据前，请先「备份 JSON」或「导出 Excel」。
      </div>
    </div>
  </section>

  <div class="fab-wrap">
    <button class="fab" id="fab" aria-label="记一笔">＋</button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="list">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></svg>
      明细
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      统计
    </button>
    <button class="tab" data-tab="settle">
      <svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
      结算
    </button>
    <button class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/></svg>
      设置
    </button>
  </nav>
</div>

<!-- ============ 记账面板 ============ -->
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <button class="sh-btn" id="shCancel">取消</button>
    <div class="sh-title" id="shTitle">记一笔</div>
    <button class="sh-btn sh-save" id="shSave">保存</button>
  </div>
  <div class="sheet-body">
    <div class="amt-block">
      <div class="lbl">金额</div>
      <div class="amt-row">
        <input class="amt-input" id="fAmount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
        <select class="cur-pick" id="fCurrency"></select>
      </div>
      <div class="amt-conv" id="convText"></div>
    </div>

    <div class="fld">
      <label>分类</label>
      <div class="cat-grid" id="catGrid"></div>
    </div>

    <div class="fld">
      <label>项目</label>
      <input type="text" id="fTitle" placeholder="例如：机场快线 / 民宿 4 晚" maxlength="40" autocomplete="off">
    </div>

    <div class="fld">
      <label>谁付的钱</label>
      <div class="chips-wrap" id="payerRow"></div>
    </div>

    <div class="fld">
      <label>谁参与分摊 <span id="partHint" style="font-weight:500;color:#a2adbd"></span></label>
      <div class="chips-wrap" id="partRow"></div>
    </div>

    <div class="fld">
      <label>怎么分摊</label>
      <div class="chips" id="splitChips"></div>
      <div id="customBox"></div>
    </div>

    <div class="fld">
      <label>支付方式</label>
      <div class="chips-wrap" id="payRow"></div>
      <div class="pay-add-box" id="payAddBox">
        <input type="text" id="payAddInput" maxlength="12" placeholder="输入名称，如 微信 / 八达通" autocomplete="off">
        <button class="btn sm primary" id="payAddOk">添加</button>
      </div>
    </div>

    <div class="fld">
      <label>日期与时间</label>
      <div class="dt-row">
        <input type="date" id="fDate">
        <input type="time" id="fTime">
      </div>
    </div>

    <div class="fld">
      <label>备注（选填）</label>
      <input type="text" id="fNote" placeholder="谁多吃了、谁买的单…" maxlength="60" autocomplete="off">
    </div>

    <div class="fld" id="delWrap" style="display:none">
      <button class="btn danger" id="btnDelete">删除这笔</button>
    </div>
    <div class="sheet-tip">数据自动保存在本机，关闭页面不会丢失</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script src="./app.js"></script>
</body>
</html>
