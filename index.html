<!DOCTYPE html>

<title>旅行记账 · 两人分摊</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  :root{
    --bg:#f2f4f9;--card:#fff;--text:#0f172a;--muted:#667085;--line:#e9edf5;
    --primary:#3b6ef6;--primary-d:#2f5fe0;--teal:#12b3a0;--danger:#e5484d;
    --r:18px;--nav-h:58px;
    --sh:0 1px 2px rgba(16,24,40,.04),0 10px 24px -18px rgba(16,24,40,.45);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);font-size:15px;line-height:1.5;background:var(--bg);
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
  }
  body.lock{overflow:hidden}
  input,select,button,textarea{font-family:inherit}
  button{cursor:pointer}
  #app{
    max-width:520px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px);
    background:var(--bg);
  }
  @media(min-width:560px){
    body{background:#e6eaf2}
    #app{box-shadow:0 0 0 1px rgba(15,23,42,.06),0 40px 80px -40px rgba(15,23,42,.3)}
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;padding:14px 18px 10px;
    background:rgba(242,244,249,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    display:flex;align-items:center;gap:12px;
  }
  .tb-title{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-right{margin-left:auto;display:flex;gap:8px;flex:none}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;
            display:grid;place-items:center;color:#475467;transition:.15s}
  .icon-btn:active{transform:scale(.94);background:#f6f8fc}

  /* ---------- 视图 ---------- */
  .view{display:none;padding:0 14px}
  .view.active{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- 主卡 ---------- */
  .hero{
    position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 18px;color:#fff;
    background:linear-gradient(125deg,#1c3b8f 0%,#3b6ef6 52%,#14b8a6 100%);
    box-shadow:0 18px 36px -24px rgba(29,78,216,.9);
  }
  .hero::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);pointer-events:none}
  .hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
  .hero-label{font-size:11.5px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.72)}
  .hero-cur{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);color:#fff;
            font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
  .hero-amount{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:6px;
               font-variant-numeric:tabular-nums;position:relative;z-index:1}
  .hero-meta{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:5px;position:relative;z-index:1}
  .hero-settle{
    margin-top:15px;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:11px 14px;position:relative;z-index:1;
    font-size:13.5px;font-weight:600;
  }
  .hero-settle .arrow{opacity:.7;font-weight:400}
  .hero-settle b{margin-left:auto;font-size:15px;font-variant-numeric:tabular-nums}
  .hero-settle.ok{background:rgba(255,255,255,.12)}

  /* ---------- 筛选 ---------- */
  .filter-row{display:flex;gap:7px;overflow-x:auto;padding:14px 2px 4px;margin:0 -2px;
              scrollbar-width:none;-webkit-overflow-scrolling:touch;
              -webkit-mask-image:linear-gradient(to right,#000 94%,rgba(0,0,0,.15));
              mask-image:linear-gradient(to right,#000 94%,rgba(0,0,0,.15))}
  .filter-row::-webkit-scrollbar{display:none}
  .fchip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;
         font-size:12.5px;font-weight:600;color:#5a6b85;transition:.15s;white-space:nowrap}
  .fchip.on{background:#eef3ff;border-color:#b9cdfb;color:#1d4ed8}

  /* ---------- 明细 ---------- */
  .day-head{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 8px;
            font-size:12px;font-weight:700;color:#8b97a8}
  .day-head b{color:#5a6b85;font-variant-numeric:tabular-nums}
  .item-wrap{position:relative;overflow:hidden;border-radius:16px;margin-bottom:8px;background:#fff;
              box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .item-del{position:absolute;right:0;top:0;bottom:0;width:88px;border:0;background:var(--danger);color:#fff;
            font-size:13px;font-weight:700}
  .item{
    position:relative;display:flex;align-items:center;gap:12px;background:#fff;padding:12px 14px;
    border-radius:16px;will-change:transform;transition:transform .22s cubic-bezier(.2,.8,.2,1);
  }
  .item:active{background:#fafbfe}
  .item-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
  .item-body{flex:1;min-width:0}
  .item-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-sub{font-size:11.5px;color:#8b97a8;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;
            overflow:hidden;white-space:nowrap}
  .tag{background:#f3f6fc;border-radius:5px;padding:1.5px 6px;font-size:10.5px;font-weight:700;color:#5a6b85;flex:none}
  .tag.a{background:#eef3ff;color:#2f5fe0}
  .tag.b{background:#e6faf5;color:#0b9c88}
  .item-amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;flex:none;line-height:1.3}
  .item-amt small{display:block;font-weight:500;color:#a2adbd;font-size:10.5px;margin-top:1px}
  .empty{padding:56px 20px;text-align:center;color:#a2adbd}
  .empty .ico{font-size:38px;opacity:.5;margin-bottom:10px}
  .empty p{margin:0;font-size:13.5px}

  /* ---------- 统计 ---------- */
  .card{background:var(--card);border-radius:var(--r);padding:16px 16px 18px;box-shadow:var(--sh);margin-bottom:14px}
  .card-h{font-size:14px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:7px}
  .card-h .sub{font-size:11.5px;color:#a2adbd;font-weight:500;margin-left:auto}
  .bar-row{margin-bottom:13px}
  .bar-row:last-child{margin-bottom:0}
  .bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;gap:10px}
  .bar-top span{color:#475467;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-top b{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .bar-top em{font-style:normal;color:#a2adbd;font-weight:500;font-size:11px;margin-left:5px}
  .bar-track{height:8px;background:#f1f4fa;border-radius:99px;overflow:hidden}
  .bar-track i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .daychart{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:8px}
  .dc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .dc-bar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#6d95fb,#3b6ef6);
          min-height:3px;transition:height .4s ease}
  .dc-lab{font-size:9.5px;color:#a2adbd;white-space:nowrap;transform:scale(.92)}
  .cmp-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
  .cmp-row .nm{width:52px;font-weight:700;color:#475467;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmp-bar{flex:1;height:20px;background:#f3f6fc;border-radius:6px;position:relative;overflow:hidden}
  .cmp-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
  .cmp-row .vv{width:78px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;flex:none}
  .cur-list{display:flex;flex-wrap:wrap;gap:8px}
  .cur-pill{background:#f6f9ff;border:1px solid #e8eefa;border-radius:11px;padding:8px 12px;font-size:11.5px;color:#5a6b85}
  .cur-pill b{display:block;color:#0f172a;font-size:14px;font-variant-numeric:tabular-nums;margin-top:1px;font-weight:700}

  /* ---------- 结算 ---------- */
  .settle-big{text-align:center;padding:26px 18px 22px}
  .settle-big .lbl{font-size:12px;font-weight:700;letter-spacing:.14em;color:#a2adbd}
  .settle-flow{font-size:17px;font-weight:700;margin-top:12px;color:#475467}
  .settle-amt{font-size:44px;font-weight:800;letter-spacing:-.035em;margin:4px 0 2px;
              font-variant-numeric:tabular-nums;color:var(--primary-d)}
  .settle-amt.ok{color:#0b9c88;font-size:30px;margin-top:12px}
  .settle-hint{font-size:12.5px;color:#8b97a8;margin-top:8px}
  .mcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .mcard{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sh)}
  .mcard .n{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .mcard .n i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;
              font-style:normal;font-weight:800;color:#fff;flex:none}
  .mcard.a .n i{background:linear-gradient(135deg,#4b7bfa,#2f5fe0)}
  .mcard.b .n i{background:linear-gradient(135deg,#22c1a4,#0b9c88)}
  .mcard .r{display:flex;justify-content:space-between;font-size:11.5px;color:#8b97a8;padding:2.5px 0;gap:6px}
  .mcard .r b{color:#0f172a;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .mcard .r.net{border-top:1px solid #f0f3f9;margin-top:6px;padding-top:8px}
  .mcard .r.net b.pos{color:#0b9c88}
  .mcard .r.net b.neg{color:#e5484d}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:1px solid var(--line);
       background:#fff;border-radius:14px;padding:13px;font-size:14.5px;font-weight:700;color:#344054;
       transition:.15s}
  .btn:active{transform:scale(.985);background:#f7f9fd}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;
               box-shadow:0 10px 22px -14px rgba(59,110,246,.95)}
  .btn.primary:active{background:var(--primary-d)}
  .btn.danger{color:var(--danger);border-color:#f6d7d6}
  .btn.danger:active{background:#fef4f3}
  .btn.sm{padding:10px;font-size:13px;border-radius:11px}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .note{font-size:11.5px;color:#a2adbd;line-height:1.7;margin-top:10px}

  /* ---------- 设置 ---------- */
  .set-group{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
  .set-group .gh{font-size:11.5px;font-weight:700;color:#8b97a8;letter-spacing:.08em;padding:14px 16px 8px;
                 background:#fff}
  .set-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid #f2f5fa;min-height:52px}
  .set-row:first-of-type{border-top:0}
  .set-row label{font-size:14px;font-weight:600;color:#344054;flex:none;width:84px}
  .set-row input[type=text],.set-row input[type=date],.set-row select{
    flex:1;min-width:0;border:0;background:transparent;text-align:right;font-size:14px;color:#0f172a;
    padding:6px 0;outline:none;appearance:none;-webkit-appearance:none;font-family:inherit
  }
  .set-row input:focus{color:var(--primary)}
  .set-row .tail{flex:none;color:#c2cad6;font-size:13px}
  .cur-row{display:grid;grid-template-columns:1fr 108px 34px;gap:8px;align-items:center;padding:9px 16px;
           border-top:1px solid #f2f5fa}
  .cur-row select{border:0;background:transparent;font-size:14px;color:#0f172a;appearance:none;
                  outline:none;font-family:inherit;padding:4px 0}
  .cur-row input{border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13.5px;
                 text-align:right;width:100%;outline:none;font-family:inherit;background:#fcfdff;color:#0f172a}
  .cur-row input:focus{border-color:#7ba0fb}
  .cur-row.base input{background:#f4f7fd;color:#a2adbd}
  .cur-row .x{border:0;background:transparent;color:#9aa5b5;font-size:15px;padding:4px}
  .add-cur{padding:12px 16px;border-top:1px solid #f2f5fa;color:var(--primary);font-size:13.5px;
           font-weight:700;display:flex;align-items:center;gap:5px;background:#fff;width:100%;border-left:0;
           border-right:0;border-bottom:0;text-align:left}
  .set-foot{display:flex;gap:9px;margin-bottom:14px}
  .data-btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 16px 16px}

  /* ---------- 底部导航 ---------- */
  .tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:40;
    height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);display:flex;
  }
  .tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:3px;color:#9aa5b5;font-size:10.5px;font-weight:600;padding:0;transition:.15s}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--primary)}
  .tab.on svg{stroke-width:2.2}
  .fab-wrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
            height:0;z-index:45;pointer-events:none}
  .fab{
    position:absolute;right:18px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
    width:56px;height:56px;border-radius:19px;border:0;pointer-events:auto;
    background:linear-gradient(135deg,#4b7bfa,#3b6ef6);color:#fff;font-size:26px;font-weight:300;
    display:grid;place-items:center;line-height:0;padding-bottom:3px;
    box-shadow:0 12px 26px -10px rgba(59,110,246,.85),0 2px 6px rgba(16,24,40,.12);
    transition:transform .16s,opacity .2s;
  }
  .fab:active{transform:scale(.92)}
  .fab.hide{opacity:0;transform:scale(.6);pointer-events:none}

  /* ---------- 记账面板 ---------- */
  .sheet{
    position:fixed;inset:0;z-index:80;background:#f7f9fd;display:flex;flex-direction:column;
    transform:translateY(100%);visibility:hidden;
    transition:transform .3s cubic-bezier(.32,.72,0,1),visibility 0s linear .3s;
  }
  .sheet.open{transform:none;visibility:visible;
    transition:transform .3s cubic-bezier(.32,.72,0,1),visibility 0s linear 0s}
  .sheet-head{
    display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:rgba(247,249,253,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex:none;
    max-width:520px;width:100%;margin:0 auto;
  }
  .sheet-head .sh-btn{border:0;background:transparent;font-size:15px;font-weight:600;color:#667085;padding:8px 4px}
  .sheet-head .sh-title{flex:1;text-align:center;font-size:16px;font-weight:700}
  .sheet-head .sh-save{color:var(--primary);font-weight:800}
  .sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 40px;
              max-width:520px;width:100%;margin:0 auto;box-sizing:border-box}
  .amt-block{background:#fff;border-radius:20px;padding:16px 18px;box-shadow:var(--sh);margin-bottom:14px}
  .amt-block .lbl{font-size:11.5px;font-weight:700;color:#8b97a8;letter-spacing:.1em}
  .amt-row{display:flex;align-items:center;gap:10px;margin-top:6px}
  .amt-input{flex:1;min-width:0;border:0;outline:none;font-size:34px;font-weight:800;letter-spacing:-.03em;
             padding:4px 0;background:transparent;color:#0f172a;font-variant-numeric:tabular-nums;width:100%}
  .amt-input::placeholder{color:#d4dae4;font-weight:700}
  .cur-pick{border:1px solid var(--line);background:#f7f9fd;border-radius:11px;padding:8px 10px;font-size:13px;
            font-weight:700;color:#475467;appearance:none;-webkit-appearance:none;outline:none;max-width:118px}
  .amt-conv{font-size:12px;color:#8b97a8;margin-top:2px;min-height:17px}
  .amt-conv b{color:var(--primary);font-weight:700}
  .fld{margin-bottom:16px}
  .fld>label{display:block;font-size:12px;font-weight:700;color:#8b97a8;margin-bottom:8px;letter-spacing:.04em}
  .fld input[type=text],.fld input[type=date]{
    width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;
    font-size:15px;color:#0f172a;outline:none;transition:.15s;appearance:none;-webkit-appearance:none
  }
  .fld input:focus{border-color:#7ba0fb;box-shadow:0 0 0 3px rgba(59,110,246,.12)}
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cat-cell{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 4px;text-align:center;
            transition:.15s;display:flex;flex-direction:column;align-items:center;gap:5px}
  .cat-cell .ci{font-size:20px;line-height:1}
  .cat-cell .cn{font-size:11.5px;font-weight:600;color:#5a6b85}
  .cat-cell.on{border-color:#7ba0fb;background:#eef3ff;box-shadow:0 0 0 1px rgba(59,110,246,.28) inset}
  .cat-cell.on .cn{color:#1d4ed8;font-weight:700}
  .seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eef1f7;padding:4px;border-radius:14px}
  .seg2 button{border:0;background:transparent;border-radius:11px;padding:11px 4px;font-size:14px;font-weight:700;
               color:#667085;transition:.15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg2 button.on{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(16,24,40,.14)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;font-size:12.5px;
        font-weight:600;color:#5a6b85;transition:.15s}
  .chip.on{border-color:#7ba0fb;background:#eef3ff;color:#1d4ed8;box-shadow:0 0 0 1px rgba(59,110,246,.25) inset}
  .ratio-box{display:none;margin-top:10px;background:#fff;border:1px dashed #d5e0f5;border-radius:14px;padding:13px 14px}
  .ratio-box.show{display:block}
  .ratio-top{display:flex;justify-content:space-between;font-size:12px;color:#5a6b85;margin-bottom:4px}

    var sym = CUR[code] ? CUR[code].symbol : code + ' ';
    var d = ZERO_DEC.indexOf(code) > -1 ? 0 : 2;
    return sym + nf(d).format(Number(n) || 0);

  function pct(v) { return (Number(v.toFixed(1))) + '%'; }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function uid() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function hexA(hex, a) {
    var h = hex.replace('#', '');
    return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' +
      parseInt(h.slice(4, 6), 16) + ',' + a + ')';

  function fmtDate(s) {
    var d = new Date(s + 'T00:00:00');
    if (isNaN(d.getTime())) return s;
    var wk = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];

  /* ========================================================
     2. 存储（IndexedDB 优先，localStorage 兜底）
     ======================================================== */
  var dbPromise = null;
  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('no indexedDB')); return; }
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { reject(e); return; }
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { reject(new Error('blocked')); };
    });
    return dbPromise;
  }
  function idbSet(key, val) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(val, key);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function idbGet(key) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readonly');
        var q = tx.objectStore(STORE).get(key);
        q.onsuccess = function () { res(q.result); };
        q.onerror = function () { rej(q.error); };
      });
    });
  }

  var persistWarned = false;
  function persist() {
    var data = JSON.parse(JSON.stringify(state));
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) { /* 配额满或隐私模式 */ }
    idbSet('state', data).catch(function () {
      if (!persistWarned) { persistWarned = true; }
    });
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
  }

  function normalize(s) {
    if (!s || !s.trip || !Array.isArray(s.expenses)) return null;
    if (!s.trip.members || s.trip.members.length < 2) {
      s.trip.members = [{ id: 'A', name: '我' }, { id: 'B', name: '同伴' }];
    }
    if (!s.trip.currencies || !s.trip.currencies.length) {
      s.trip.currencies = [{ code: s.trip.base || 'CNY', rate: 1 }];
    }
    s.trip.base = s.trip.base || s.trip.currencies[0].code;
    return s;
  }

  function rateOf(code) {
    var c = state.trip.currencies.filter(function (x) { return x.code === code; })[0];
    return c && Number(c.rate) > 0 ? Number(c.rate) : 1;
  }
  function expBase(e) { return Number(e.amount) * rateOf(e.currency); }
  function nameA() { return state.trip.members[0].name || 'A'; }
  function nameB() { return state.trip.members[1].name || 'B'; }
  function days() {
    var s = state.trip.start, e = state.trip.end;
    if (!s || !e) return 1;
    var d = (new Date(e) - new Date(s)) / 86400000 + 1;
    return d > 0 ? Math.round(d) : 1;
  }
  function summarize() {
    var r = { total: 0, paidA: 0, paidB: 0, bearA: 0, bearB: 0, count: state.expenses.length, byCat: {}, byCur: {}, byDate: {}, balanceA: 0 };
    state.expenses.forEach(function (e) {
      var b = expBase(e), ratio = (Number(e.ratioA) || 0) / 100;
      r.total += b;
      if (e.payer === 'A') r.paidA += b; else r.paidB += b;
      r.bearA += b * ratio; r.bearB += b * (1 - ratio);
      r.byCat[e.cat] = (r.byCat[e.cat] || 0) + b;
      r.byCur[e.currency] = (r.byCur[e.currency] || 0) + Number(e.amount);
      r.byDate[e.date] = (r.byDate[e.date] || 0) + b;
    });
    r.balanceA = r.paidA - r.bearA;
    return r;
  }

  /* 左滑删除 */
  var swipedEl = null;
  function closeSwipe(wrap) {
    if (!wrap) return;
    wrap.classList.remove('swiped');
    var it = wrap.querySelector('.item');
    if (it) it.style.transform = '';
    if (swipedEl === wrap) swipedEl = null;
  }
  function bindSwipe(container) {
    var sx = 0, sy = 0, wrap = null, dx = 0, active = false, locked = false;
    container.addEventListener('touchstart', function (ev) {
      var w = ev.target.closest ? ev.target.closest('.item-wrap') : null;
      if (!w) return;
      if (swipedEl && swipedEl !== w) closeSwipe(swipedEl);
      wrap = w; sx = ev.touches[0].clientX; sy = ev.touches[0].clientY;
      dx = 0; active = true; locked = false;
    }, { passive: true });
    container.addEventListener('touchmove', function (ev) {
      if (!active || !wrap) return;
      var mx = ev.touches[0].clientX - sx, my = ev.touches[0].clientY - sy;
      if (!locked) {
        if (Math.abs(my) > Math.abs(mx)) { active = false; return; }
        if (Math.abs(mx) < 6) return;
        locked = true;
      }
      dx = Math.max(-92, Math.min(0, mx - (wrap.classList.contains('swiped') ? 88 : 0)));
      var it = wrap.querySelector('.item');
      if (it) { it.style.transition = 'none'; it.style.transform = 'translateX(' + dx + 'px)'; }
    }, { passive: true });
    container.addEventListener('touchend', function () {
      if (!active || !wrap) { active = false; return; }
      active = false;
      var it = wrap.querySelector('.item');
      if (!it) return;
      it.style.transition = 'transform .22s cubic-bezier(.2,.8,.2,1)';
      if (dx < -44) { it.style.transform = 'translateX(-88px)'; wrap.classList.add('swiped'); swipedEl = wrap; }
      else { it.style.transform = ''; wrap.classList.remove('swiped'); if (swipedEl === wrap) swipedEl = null; }
    });
  }

  var formMode = 'equal';
  var formRatio = 50;

  function defaultDate() {
    var t = todayStr(), s = state.trip.start, e = state.trip.end;

    if (e && t > e) return e;
    return t;
  }

  function openSheet(id) {
    editingId = id || null;
    var e = id ? state.expenses.filter(function (x) { return x.id === id; })[0] : null;

    $('shTitle').textContent = e ? '修改记录' : '记一笔';
    $('delWrap').style.display = e ? '' : 'none';

    if (e) {
      $('fAmount').value = e.amount;
      $('fTitle').value = e.title;
      $('fNote').value = e.note || '';
      $('fDate').value = e.date;
      formCat = e.cat || 'other';
      formPayer = e.payer;
      formMode = e.mode || 'equal';
      formRatio = Number(e.ratioA) || 0;
    } else {
      $('fAmount').value = '';
      $('fTitle').value = '';
      $('fNote').value = '';
      $('fDate').value = defaultDate();
      formCat = 'food';
      formPayer = 'A';
      formMode = 'equal';
      formRatio = 50;
    }

    buildCurrencySelect(e ? e.currency : null);
    buildCatGrid();
    buildPayerSeg();
    $('fRatio').value = formRatio;
    buildSplitChips();
    updateConv();

    $('sheet').classList.add('open');
    document.body.classList.add('lock');
    $('fab').classList.add('hide');
    setTimeout(function () {
      if (!e) $('fAmount').focus();
    }, 320);
  }

  function closeSheet() {
    $('sheet').classList.remove('open');
    document.body.classList.remove('lock');
    $('fab').classList.toggle('hide', currentView !== 'list');
    editingId = null;
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
  }

  function buildCurrencySelect(prefer) {
    var sel = $('fCurrency');
    sel.innerHTML = state.trip.currencies.map(function (c) {
      return '<option value="' + c.code + '">' + c.code + '</option>';
    }).join('');
    var code = prefer || sel.value;
    var has = state.trip.currencies.some(function (c) { return c.code === code; });
    sel.value = has ? code : state.trip.base;
  }

  function buildCatGrid() {
    $('catGrid').innerHTML = CATS.map(function (c) {
      return '<button class="cat-cell' + (formCat === c.id ? ' on' : '') + '" data-cat="' + c.id + '">' +
        '<span class="ci">' + c.icon + '</span><span class="cn">' + c.name + '</span></button>';
    }).join('');

      b.addEventListener('click', function () {
        formPayer = this.getAttribute('data-p');
        buildPayerSeg();
        buildSplitChips();
      });
    });
  }

  function buildSplitChips() {
    var opts = [
      { k: 'equal', t: '⚖️ 平摊' },
      { k: 'a', t: esc(nameA()) + ' 全担' },
      { k: 'b', t: esc(nameB()) + ' 全担' },
      { k: 'custom', t: '✎ 自定义' }
    ];
    $('splitChips').innerHTML = opts.map(function (o) {
      return '<button class="chip' + (formMode === o.k ? ' on' : '') + '" data-m="' + o.k + '">' + o.t + '</button>';
    }).join('');

      b.addEventListener('click', function () {
        formMode = this.getAttribute('data-m');
        if (formMode === 'equal') formRatio = 50;
        if (formMode === 'a') formRatio = 100;
        if (formMode === 'b') formRatio = 0;
        $('fRatio').value = formRatio;
        buildSplitChips();
        syncRatio();
      });

  function syncRatio() {
    $('ratioBox').className = 'ratio-box' + (formMode === 'custom' ? ' show' : '');
    $('ratioLeft').textContent = nameA() + ' 承担';
    $('ratioRight').textContent = pct(formRatio) + ' / ' + esc(nameB()) + ' ' + pct(100 - formRatio);
  }

  function updateConv() {
    var raw = $('fAmount').value;
    var amt = parseFloat(String(raw).replace(/[^\d.]/g, '')) || 0;
    var code = $('fCurrency').value;
    if (!amt) { $('convText').innerHTML = ''; return; }
    if (code === state.trip.base) {
      $('convText').innerHTML = '结算货币';
    } else {
      $('convText').innerHTML = '≈ <b>' + money(amt * rateOf(code)) + '</b>　（1 ' + code + ' = ' + rateOf(code) + ' ' + state.trip.base + '）';
    }
  }

  function saveSheet() {
    var amt = parseFloat(String($('fAmount').value).replace(/[^\d.]/g, ''));
    if (!(amt > 0)) { toast('请输入金额'); $('fAmount').focus(); return; }
    var title = $('fTitle').value.trim();
    if (!title) { toast('请输入项目名称'); $('fTitle').focus(); return; }

    var ratioA = formMode === 'equal' ? 50 : formMode === 'a' ? 100 : formMode === 'b' ? 0 : formRatio;
    var data = {
      date: $('fDate').value || todayStr(),
      title: title,
      cat: formCat,
      amount: Math.round(amt * 100) / 100,
      currency: $('fCurrency').value,
      payer: formPayer,
      mode: formMode,
      ratioA: ratioA,
      note: $('fNote').value.trim()
    };

    if (editingId) {
      state.expenses = state.expenses.map(function (e) {
        return e.id === editingId ? Object.assign({}, e, data) : e;
      });
    } else {
      data.id = uid();
      data.createdAt = Date.now();
      state.expenses.push(data);
    }
    persist();
    closeSheet();
    renderAll();
    toast(editingId ? '已保存' : '已记账');
  }

  function settlementText() {
    var s = summarize();
    var L = [];
    L.push('【' + (state.trip.name || '旅行') + '】账目结算');
    if (state.trip.start) L.push(state.trip.start + ' ~ ' + (state.trip.end || '') + '，共 ' + days() + ' 天');
    L.push('');
    L.push('总支出 ' + money(s.total) + '（人均 ' + money(s.total / 2) + '）');
    L.push(nameA() + ' 已付 ' + money(s.paidA) + '，应担 ' + money(s.bearA));
    L.push(nameB() + ' 已付 ' + money(s.paidB) + '，应担 ' + money(s.bearB));
    L.push('');
    if (!s.count) L.push('还没有记录');
    else if (Math.abs(s.balanceA) < 0.01) L.push('✅ 账目已平，无需转账');
    else if (s.balanceA > 0) L.push('👉 ' + nameB() + ' 应付 ' + nameA() + ' ' + money(s.balanceA));
    else L.push('👉 ' + nameA() + ' 应付 ' + nameB() + ' ' + money(-s.balanceA));
    return L.join('\n');
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制，去粘贴给对方吧'); },
        function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }

  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zipStore(files) {
    var enc = new TextEncoder();
    var now = new Date();
    var dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
    var dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
    var parts = [], central = [], offset = 0;

    files.forEach(function (f) {
      var nb = enc.encode(f.name);
      var data = f.data;
      var crc = crc32(data);
      var lh = new Uint8Array(30 + nb.length);
      var dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0x0800, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(10, dosTime, true);
      dv.setUint16(12, dosDate, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, data.length, true);
      dv.setUint32(22, data.length, true);
      dv.setUint16(26, nb.length, true);
      dv.setUint16(28, 0, true);
      lh.set(nb, 30);
      parts.push(lh, data);

      var ch = new Uint8Array(46 + nb.length);
      var cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nb.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      ch.set(nb, 46);
      central.push(ch);

      offset += lh.length + data.length;
    });

    var cdSize = central.reduce(function (a, b) { return a + b.length; }, 0);
    var end = new Uint8Array(22);
    var ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    var total = offset + cdSize + 22;
    var out = new Uint8Array(total);
    var p = 0;
    parts.forEach(function (x) { out.set(x, p); p += x.length; });
    central.forEach(function (x) { out.set(x, p); p += x.length; });
    out.set(end, p);
    return out;
  }

  function xmlEsc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' })[m];
    });
  }
  function colName(n) {
    var s = '';
    while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }
  function S(v, s) { return { v: v == null ? '' : String(v), t: 's', s: s || 2 }; }
  function H(v) { return { v: v, t: 's', s: 1 }; }
  function N(v, s) { return { v: Number(v) || 0, t: 'n', s: s || 3 }; }

  function sheetXml(rows, widths, freeze) {
    var body = '';
    for (var r = 0; r < rows.length; r++) {
      body += '<row r="' + (r + 1) + '">';
      for (var c = 0; c < rows[r].length; c++) {
        var cell = rows[r][c];
        if (cell == null) continue;
        var ref = colName(c + 1) + (r + 1);
        if (cell.t === 'n') {
          body += '<c r="' + ref + '" s="' + cell.s + '"><v>' + (isFinite(cell.v) ? cell.v : 0) + '</v></c>';
        } else {
          body += '<c r="' + ref + '" t="inlineStr" s="' + cell.s + '"><is><t xml:space="preserve">' +
            xmlEsc(cell.v) + '</t></is></c>';
        }
      }
      body += '</row>';
    }
    var cols = '';
    if (widths && widths.length) {
      cols = '<cols>' + widths.map(function (w, i) {
        return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
      }).join('') + '</cols>';
    }
    var pane = freeze ? '<sheetViews><sheetView workbookViewId="0">' +
      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
      '</sheetView></sheetViews>' : '<sheetViews><sheetView workbookViewId="0"/></sheetViews>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      pane + cols + '<sheetData>' + body + '</sheetData></worksheet>';
  }

      '</Types>';

    var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';

    var wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      '<sheet name="支出明细" sheetId="1" r:id="rId1"/>' +
      '<sheet name="结算汇总" sheetId="2" r:id="rId2"/>' +
      '<sheet name="分类统计" sheetId="3" r:id="rId3"/>' +
      '</sheets></workbook>';

    var wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>' +
      '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet3.xml"/>' +
      '<Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>';

    return zipStore([
      { name: '[Content_Types].xml', data: enc.encode(ct) },
      { name: '_rels/.rels', data: enc.encode(rels) },
      { name: 'xl/workbook.xml', data: enc.encode(wb) },
      { name: 'xl/_rels/workbook.xml.rels', data: enc.encode(wbRels) },
      { name: 'xl/styles.xml', data: enc.encode(styles) },
      { name: 'xl/worksheets/sheet1.xml', data: enc.encode(sheetXml(r1, w1, true)) },
      { name: 'xl/worksheets/sheet2.xml', data: enc.encode(sheetXml(r2, w2, false)) },
      { name: 'xl/worksheets/sheet3.xml', data: enc.encode(sheetXml(r3, w3, true)) }
    ]);
  }

  /* ========================================================
     8. 导出 / 导入
     ======================================================== */
  function fileStamp() {
    var d = new Date();
    var p = function (n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
  }
  function safeName(s) { return String(s || '旅行账单').replace(/[\\/:*?"<>|]/g, '_'); }

  function download(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1200);
    try {
      localStorage.setItem(EXPORT_KEY, new Date().toLocaleString('zh-CN', { hour12: false }).slice(0, 16));
    } catch (e) {}
  }

  function exportXlsx() {
    if (!state.expenses.length) { toast('还没有记录可以导出'); return; }
    try {
      var bytes = buildXlsx();
      var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      download(blob, safeName(state.trip.name) + '_' + fileStamp() + '.xlsx');
      toast('Excel 已生成，去「文件/下载」里查看');
    } catch (e) {
      toast('导出失败：' + e.message);
    }
  }

  function exportCsv() {
    if (!state.expenses.length) { toast('还没有记录可以导出'); return; }
    var head = ['日期', '项目', '分类', '币种', '金额', '汇率', '折合' + state.trip.base, '付款人', '分摊方式',
      nameA() + '承担', nameB() + '承担', '备注'];
    var lines = [head.join(',')];
    state.expenses.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (e) {
      var base = expBase(e), r = (Number(e.ratioA) || 0) / 100;
      var row = [e.date, e.title, (CATMAP[e.cat] || CATMAP.other).name, e.currency, e.amount,
        rateOf(e.currency), base.toFixed(2), e.payer === 'A' ? nameA() : nameB(), splitText(e),
        (base * r).toFixed(2), (base * (1 - r)).toFixed(2), e.note || ''];
      lines.push(row.map(function (v) {
        v = String(v == null ? '' : v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(','));
    });
    var s = summarize();
    lines.push('');
    lines.push(['合计', '', '', '', '', '', s.total.toFixed(2), '', '', s.bearA.toFixed(2), s.bearB.toFixed(2), ''].join(','));
    lines.push(['结算', '', '', '', '', '', Math.abs(s.balanceA).toFixed(2), '', '', '', '',
      Math.abs(s.balanceA) < 0.01 ? '已结清' : (s.balanceA > 0 ? nameB() + ' 付给 ' + nameA() : nameA() + ' 付给 ' + nameB())].join(','));

    download(new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }),
      safeName(state.trip.name) + '_' + fileStamp() + '.csv');
    toast('CSV 已导出');
  }

  function exportJson() {
    download(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json;charset=utf-8' }),
      safeName(state.trip.name) + '_备份_' + fileStamp() + '.json');
    toast('备份已导出');
  }

  function importJson(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var s = normalize(JSON.parse(reader.result));
        if (!s) throw new Error('文件格式不正确');
        if (!window.confirm('导入将覆盖当前全部数据，确定继续？')) return;
        state = s;
        persist();
        renderAll();
        if (currentView === 'settings') renderSettings();
        toast('导入成功');
      } catch (err) {
        toast('导入失败：' + err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  /* ========================================================
     9. 事件
     ======================================================== */
  var filterCat = 'all';

  function switchView(name) {
    currentView = name;
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function (v) {
      v.classList.toggle('active', v.getAttribute('data-view') === name);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.classList.toggle('on', t.getAttribute('data-tab') === name);
    });
    if (name === 'settings') renderSettings();
    $('fab').classList.toggle('hide', name !== 'list');
    window.scrollTo(0, 0);
  }

  function bind() {
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.addEventListener('click', function () { switchView(this.getAttribute('data-tab')); });
    });
    $('btnGoSettings').addEventListener('click', function () { switchView('settings'); });
    $('fab').addEventListener('click', function () { openSheet(null); });
    $('shCancel').addEventListener('click', closeSheet);
    $('shSave').addEventListener('click', saveSheet);

    $('fAmount').addEventListener('input', updateConv);
    $('fCurrency').addEventListener('change', updateConv);
    $('fRatio').addEventListener('input', function () { formRatio = Number(this.value); syncRatio(); });
    $('fTitle').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); saveSheet(); } });

    $('btnCopy').addEventListener('click', function () { copyText(settlementText()); });
    $('heroSettle').addEventListener('click', function () { switchView('settle'); });

    $('btnXlsx').addEventListener('click', exportXlsx);
    $('btnCsv').addEventListener('click', exportCsv);
    $('btnBackup').addEventListener('click', exportJson);
    $('btnRestore').addEventListener('click', function () { $('fileInput').click(); });
    $('fileInput').addEventListener('change', function () {
      if (this.files && this.files[0]) importJson(this.files[0]);
      this.value = '';
    });

    $('btnDelete').addEventListener('click', function () {
      if (!editingId) return;
      var e = state.expenses.filter(function (x) { return x.id === editingId; })[0];
      if (!e) return;
      if (!window.confirm('删除「' + e.title + '」？')) return;
      state.expenses = state.expenses.filter(function (x) { return x.id !== editingId; });
      persist(); closeSheet(); renderAll(); toast('已删除');
    });

    $('btnClear').addEventListener('click', function () {
      if (!state.expenses.length) { toast('已经是空的了'); return; }
      if (!window.confirm('清空全部 ' + state.expenses.length + ' 条明细？此操作不可恢复，建议先导出备份。')) return;
      state.expenses = [];
      persist(); renderAll(); renderSettings(); toast('已清空');
    });

    $('btnAddCur').addEventListener('click', function () {
      var used = state.trip.currencies.map(function (c) { return c.code; });
      var pick = Object.keys(CUR).filter(function (k) { return used.indexOf(k) === -1; })[0];
      if (!pick) { toast('常用币种都加过了'); return; }
      state.trip.currencies.push({ code: pick, rate: 1 });
      renderCurRows();
    });

    $('sBase').addEventListener('change', function () {
      state.trip.base = this.value;
      var found = state.trip.currencies.some(function (c) { return c.code === state.trip.base; });
      if (!found) state.trip.currencies.push({ code: state.trip.base, rate: 1 });
      state.trip.currencies.forEach(function (c) { if (c.code === state.trip.base) c.rate = 1; });
      renderCurRows();
    });

    $('btnSaveSettings').addEventListener('click', function () {
      applySettings();
      renderSettings();
      toast('设置已保存');
    });

    // 改动即自动保存（防忘按保存）
    var stTimer = null;
    function queueSave() {
      clearTimeout(stTimer);
      stTimer = setTimeout(function () {
        applySettings();
        renderAll(true);
      }, 700);
    }
    ['sName', 'sDest', 'sStart', 'sEnd', 'sNameA', 'sNameB'].forEach(function (id) {
      $(id).addEventListener('input', queueSave);
      $(id).addEventListener('change', queueSave);
    });
    $('curRows').addEventListener('input', queueSave);
    $('curRows').addEventListener('change', queueSave);
  }

  /* ========================================================
     10. 启动
     ======================================================== */
  function seedIfEmpty(s) {
    return s || demoState();
  }

  function start(s) {
    state = normalize(seedIfEmpty(s)) || demoState();
    bind();
    renderAll();
    persist();

    // 请求持久化存储，降低被系统清理的概率
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
  }

  function readLS() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  (function boot() {
    // 策略：localStorage 是同步的，先用它立刻渲染，绝不白屏；
    // 只有在没有 localStorage 数据时，才等 IndexedDB（最多 1.5 秒）。
    var local = readLS();
    if (local) {
      start(local);
    } else {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        start(demoState());
      }, 1500);
      idbGet('state').then(function (v) {
        if (settled) return;
        settled = true; clearTimeout(timer);
        start(v || demoState());
      }).catch(function () {
        if (settled) return;
        settled = true; clearTimeout(timer);
        start(demoState());
      });
    }

    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  })();

  // 调试钩子（供自动化测试使用）
  window.__app = {
    get state() { return state; },
    buildXlsx: buildXlsx,
    summarize: summarize,
    switchView: switchView
  };
})();
</script>
